<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Zia Ul Hassan logo">
  <defs>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff2a6d" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg{fill:#05040a}
      .mark{fill:none;stroke:url(#neon);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
      .inner{fill:#071023}
      .mono{font-family:Orbitron, sans-serif; font-weight:700; font-size:36px; fill:#fff}
      .breathe{animation:breathe 2.4s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:0.85}50%{opacity:1}}
    </style>
  </defs>

  <rect class="bg" width="120" height="120" rx="18"/>

  <!-- neon monogram ZH -->
  <g transform="translate(12,12) scale(0.8)">
    <rect class="inner" x="6" y="6" width="96" height="96" rx="14"/>
    <path class="mark breathe" d="M30 38 L54 38 L54 58 L30 82 L30 66 L46 50 30 50"/>
    <path class="mark breathe" d="M66 38 L84 38 L84 82"/>
    <text x="70" y="96" font-size="10" fill="#9ae6ff" font-family="Share Tech Mono, monospace">ZH</text>
  </g>

</svg>
